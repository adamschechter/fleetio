name: 'fleetio'
version: '1.0.0'
config-version: 2

profile: 'fleetio'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  fleetio:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  fleetio:
    +quote_columns: false
    contacts:
      +column_types:
        created_at: string
    leads:
      +column_types:
        created_at: string
        converted_at: string
    opportunities:
      +column_types:
        created_at: string
        closed_at: string
