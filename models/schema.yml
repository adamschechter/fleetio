version: 2

models:
  - name: stg_leads
    description: Cleaned lead records loaded from the leads seed. One row per lead.
    columns:
      - name: lead_id
        tests: [not_null, unique]
      - name: lead_source
        tests: [not_null]

  - name: stg_contacts
    description: Cleaned contacts created when leads convert. One row per contact.
    columns:
      - name: contact_id
        tests: [not_null, unique]
      - name: lead_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_leads')
                field: lead_id

  - name: stg_accounts
    description: Cleaned account records. One row per account.
    columns:
      - name: account_id
        tests: [not_null, unique]

  - name: stg_opportunities
    description: Cleaned sales opportunities. One row per opportunity.
    columns:
      - name: opportunity_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

  - name: int_lead_lifecycle
    description: Joined lead-to-contact-to-account-to-opportunity lifecycle used by the funnel fact models.
    columns:
      - name: lead_id
        tests: [not_null, unique]

  - name: fct_lead_conversion
    description: Lead-level funnel fact for conversion rates and conversion drivers.
    columns:
      - name: lead_id
        tests: [not_null, unique]

  - name: fct_opportunity
    description: Opportunity-level fact for closed and won analysis.
    columns:
      - name: opportunity_id
        tests: [not_null, unique]
